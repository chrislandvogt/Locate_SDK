name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Two jobs, as in GitHub's starter workflow: deploying in the same job straight after the upload
# intermittently fails with 'No artifacts named "github-pages"' (actions/deploy-pages known issue).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Keys come from repository secrets and exist only in the deployed site, never in git.
      # ARCGIS_API_KEY: the Location Platform key (basemaps, search, directions, places).
      # FOUNDRY_*: must stay unset. The AI chat is presenter-only, and check.mjs fails if they're set.
      - name: Write runtime config
        env:
          ARCGIS_API_KEY: ${{ secrets.ARCGIS_API_KEY }}
          FOUNDRY_URL: ${{ secrets.FOUNDRY_URL }}
          FOUNDRY_KEY: ${{ secrets.FOUNDRY_KEY }}
          FOUNDRY_MODEL: ${{ secrets.FOUNDRY_MODEL }}
          FOUNDRY_AUTH: ${{ vars.FOUNDRY_AUTH }}
          FOUNDRY_LABEL: ${{ vars.FOUNDRY_LABEL }}
        run: node scripts/write-runtime-config.mjs app/runtime-config.js

      - name: Check config and catalogue
        run: node scripts/check.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
